[workspace]
resolver = "2"
members = ["crates/egress", "crates/atproto-identity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bluesky-social/rust-tools"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "macros"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
