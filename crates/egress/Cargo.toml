[package]
name = "egress"
description = "Outbound HTTP for services that fetch untrusted URLs: connect-time address policy, no redirects unless opted in, and bounded response bodies."
keywords = ["ssrf", "http", "security", "egress"]
categories = ["network-programming", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.6"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "ReadableStream", "RequestInit", "RequestRedirect", "Response", "WorkerGlobalScope"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "macros", "io-util"] }
